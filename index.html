<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Book Library</title>

    <link rel="stylesheet" href="style.css" />

    <!-- React libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Lets the browser read React JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

function App() {
  const [books, setBooks] = useState([
    {
      id: 1,
      title: "Tomorrow, and Tomorrow, and Tomorrow",
      author: "Gabrielle Zevin"
    }
  ]);

  const [title, setTitle] = useState("");
  const [author, setAuthor] = useState("");
  const [search, setSearch] = useState("");

  function addBook(event) {
    event.preventDefault();

    if (title.trim() === "" || author.trim() === "") {
      alert("Please enter both a title and author.");
      return;
    }

    const newBook = {
      id: Date.now(),
      title: title.trim(),
      author: author.trim()
    };

    setBooks([...books, newBook]);
    setTitle("");
    setAuthor("");
  }

  function removeBook(id) {
    setBooks(books.filter((book) => book.id !== id));
  }

  const visibleBooks = books.filter((book) =>
    book.title.toLowerCase().includes(search.toLowerCase()) ||
    book.author.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <main className="container">
      <h1>Mini Book Library</h1>
      <p>Add, search, and remove books from your library.</p>

      <form onSubmit={addBook} className="book-form">
        <input
          type="text"
          placeholder="Book title"
          value={title}
          onChange={(event) => setTitle(event.target.value)}
        />

        <input
          type="text"
          placeholder="Author"
          value={author}
          onChange={(event) => setAuthor(event.target.value)}
        />

        <button type="submit">Add Book</button>
      </form>

      <input
        className="search-bar"
        type="text"
        placeholder="Search by title or author"
        value={search}
        onChange={(event) => setSearch(event.target.value)}
      />

      <section className="book-list">
        <h2>Your Library</h2>

        {visibleBooks.length === 0 ? (
          <p>No matching books found.</p>
        ) : (
          visibleBooks.map((book) => (
            <article className="book-card" key={book.id}>
              <div>
                <h3>{book.title}</h3>
                <p>by {book.author}</p>
              </div>

              <button onClick={() => removeBook(book.id)}>
                Remove
              </button>
            </article>
          ))
        )}
      </section>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
